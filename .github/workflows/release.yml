name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - name: Verify formatting
        run: mise run format-check
      - name: Build
        run: mise run build
      - name: Test
        shell: pwsh
        run: |
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $runtime = $runtimeKeys | ForEach-Object { Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue } | Where-Object { $_.pv -and [Version]$_.pv -gt [Version]'0.0.0.0' }
          if (-not $runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*O=Microsoft Corporation,*') {
              throw 'The WebView2 installer does not have a valid Microsoft signature.'
            }
            $setup = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($setup.ExitCode -notin @(0, 3010)) { throw "WebView2 setup failed with exit code $($setup.ExitCode)." }
          }
          mise run test
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release -- -Publish
