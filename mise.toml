[tools]
dotnet = "10.0.403"

[tasks.build]
run = "dotnet build OutlookAutomail.slnx --configuration Release"

[tasks.test]
run = "dotnet test OutlookAutomail.slnx --configuration Release"

[tasks.format-check]
run = "dotnet format OutlookAutomail.slnx --verify-no-changes --verbosity quiet"

[tasks.release]
run = "pwsh -NoProfile -File scripts/Release.ps1"

[tasks.publish]
run = "dotnet publish src/OutlookAutomail/OutlookAutomail.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64"

[tasks.publish-small]
run = "dotnet publish src/OutlookAutomail/OutlookAutomail.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/framework-dependent"
